name: CI

on:
  push:
    branches: ["main", "post/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        run: uv sync --all-extras

      # Lint and test the package and every demo, then for each demo under demos/:
      # build, check its headline number, synth its stack and scan the template with checkov.
      - name: Package and demo checks
        run: make ci

      - name: Secrets scan
        run: |
          if grep -rEn 'AKI[A][0-9A-Z]{16}|aws_secret_access_ke[y]|-----BEGI[N]' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=cdk.out --exclude-dir=.venv --exclude=ci.yml . ; then
            echo "Possible secret found"; exit 1; fi

      - name: Upload template
        uses: actions/upload-artifact@v7
        with:
          name: cdk-template
          path: demos/*/infra/cdk.out/*.template.json
