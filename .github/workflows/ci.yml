name: CI

on:
  push:
    branches: ["main", "post/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          uv sync --all-extras
          cd infra && npm ci

      - name: Lint and test
        run: make lint test

      - name: Build and check the headline coverage
        run: |
          make build | tee build.log
          grep -F '97.3% (497/511)' build.log

      - name: Synth
        run: make synth

      - name: Scan IaC with checkov
        run: uv run checkov -f infra/cdk.out/ironbridge-m4.template.json --framework cloudformation --quiet --compact

      - name: Secrets scan
        run: |
          if grep -rEn 'AKI[A][0-9A-Z]{16}|aws_secret_access_ke[y]|-----BEGI[N]' --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=cdk.out --exclude-dir=.venv --exclude=ci.yml . ; then
            echo "Possible secret found"; exit 1; fi

      - name: Upload template
        uses: actions/upload-artifact@v4
        with:
          name: cdk-template
          path: infra/cdk.out/*.template.json
